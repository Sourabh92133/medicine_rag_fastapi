<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQuery — AI Medicine Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --accent: #00c896;
            --accent2: #00a87e;
            --text: #e6edf3;
            --muted: #7d8590;
            --user: #1a3a4a;
            --bot: #1c2330;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 18px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(22,27,34,0.95);
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #007a5e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        header h1 {
            font-family: "DM Serif Display", serif;
            font-size: 1.2rem;
        }

        .status {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar { width: 4px; }
        #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .welcome {
            text-align: center;
            padding-top: 60px;
            animation: fadeUp 0.5s ease;
        }

        .welcome h2 {
            font-family: "DM Serif Display", serif;
            font-size: 1.7rem;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .suggestion {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 7px 15px;
            font-size: 0.8rem;
            color: var(--muted);
            cursor: pointer;
            font-family: "DM Sans", sans-serif;
            transition: all 0.2s;
        }

        .suggestion:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            animation: fadeUp 0.3s ease;
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.user .avatar { background: var(--user); }
        .message.bot .avatar { background: linear-gradient(135deg, var(--accent), #007a5e); }

        .bubble {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 680px;
        }

        .message.user .bubble {
            background: var(--user);
            border-top-right-radius: 4px;
        }

        .message.bot .bubble {
            background: var(--bot);
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }

        .bubble p { margin-bottom: 8px; }
        .bubble p:last-child { margin-bottom: 0; }

        .bubble strong {
            color: var(--accent);
            font-size: 0.88rem;
            display: block;
            margin: 12px 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .bubble strong:first-child { margin-top: 0; }

        .bubble ul, .bubble ol {
            padding-left: 18px;
            margin: 6px 0 10px;
        }

        .bubble li { margin-bottom: 4px; line-height: 1.6; }

        .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 0.82rem;
        }

        .bubble table td, .bubble table th {
            border: 1px solid var(--border);
            padding: 8px 10px;
            vertical-align: top;
            text-align: left;
        }

        .bubble table th {
            background: rgba(0, 200, 150, 0.1);
            color: var(--accent);
            font-weight: 600;
        }

        .bubble table tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .bubble .med-title {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
            padding: 6px 10px;
            background: rgba(0, 200, 150, 0.07);
            border-left: 3px solid var(--accent);
            border-radius: 0 6px 6px 0;
            margin: 10px 0 6px;
        }

        .bubble hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error { color: #f85149; font-size: 0.88rem; }

        footer {
            padding: 16px 24px 20px;
            border-top: 1px solid var(--border);
            background: rgba(13,17,23,0.95);
        }

        .input-box {
            display: flex;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 10px 10px 16px;
            max-width: 800px;
            margin: auto;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,200,150,0.07);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            font-size: 0.92rem;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }

        textarea::placeholder { color: var(--muted); }

        button {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            font-size: 16px;
        }

        button:hover { background: var(--accent2); }
        button:disabled { background: var(--border); cursor: not-allowed; }

        .note {
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 8px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">💊</div>
    <h1>MediQuery</h1>
    <div class="status">Connected</div>
</header>

<div id="chat">
    <div class="welcome" id="welcome">
        <h2>Ask me about medicines</h2>
        <p>Ask about dosage, side effects, interactions or recommendations.</p>

    </div>
</div>

<footer>
    <div class="input-box">
        <textarea id="question" rows="1" placeholder="Ask about any medicine..."
                  onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button onclick="sendMessage()" id="send-btn">➤</button>
    </div>
    <p class="note">⚕️ For informational purposes only. Always consult a healthcare professional.</p>
</footer>

<script>
    const chat = document.getElementById("chat")
    const input = document.getElementById("question")
    const btn = document.getElementById("send-btn")
    let loading = false

    function autoResize(el) {
        el.style.height = "auto"
        el.style.height = el.scrollHeight + "px"
    }

    function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault()
            sendMessage()
        }
    }

    function useSuggestion(el) {
        input.value = el.textContent
        sendMessage()
    }

    function removeWelcome() {
        const w = document.getElementById("welcome")
        if (w) w.remove()
    }

    function formatAnswer(text) {
        const lines = text.split('\n')
        let html = ''
        let tableLines = []
        let inTable = false
        let listItems = []

        function flushList() {
            if (listItems.length) {
                html += '<ul>' + listItems.map(i => `<li>${i}</li>`).join('') + '</ul>'
                listItems = []
            }
        }

        function flushTable() {
            if (tableLines.length) {
                let tableHtml = '<table>'
                let isFirst = true
                for (let row of tableLines) {
                    const cells = row.split('|').map(c => c.trim()).filter(c => c)
                    if (cells.every(c => /^[-:]+$/.test(c))) continue
                    const tag = isFirst ? 'th' : 'td'
                    tableHtml += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>'
                    isFirst = false
                }
                tableHtml += '</table>'
                html += tableHtml
                tableLines = []
                inTable = false
            }
        }

        for (let line of lines) {
            line = line.trim()
            if (!line) { flushList(); flushTable(); continue }

            // Table
            if (line.startsWith('|') && line.endsWith('|')) {
                flushList()
                inTable = true
                tableLines.push(line.slice(1, -1))
                continue
            } else if (inTable) {
                flushTable()
            }

            // Numbered medicine titles
            if (/^\d+\./.test(line)) {
                flushList()
                html += `<div class="med-title">${line}</div>`
                continue
            }

            // Bullet points
            if (line.startsWith('•') || line.startsWith('-') || line.startsWith('*')) {
                listItems.push(line.replace(/^[•\-\*]\s*/, ''))
                continue
            } else {
                flushList()
            }

            // Bold headers **text**
            if (line.startsWith('**') && line.endsWith('**')) {
                html += `<strong>${line.replace(/\*\*/g, '')}</strong>`
                continue
            }

            // Section headers ##
            if (line.startsWith('#')) {
                html += `<strong>${line.replace(/^#+\s*/, '')}</strong>`
                continue
            }

            // Horizontal rule
            if (line === '---') { html += '<hr>'; continue }

            // Inline bold
            line = line.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            html += `<p>${line}</p>`
        }

        flushList()
        flushTable()

        return html || `<p>${text}</p>`
    }

    function addUserMsg(text) {
        removeWelcome()
        const div = document.createElement("div")
        div.className = "message user"
        div.innerHTML = `<div class="avatar">👤</div><div class="bubble">${text}</div>`
        chat.appendChild(div)
        chat.scrollTop = chat.scrollHeight
    }

    function addLoading() {
        const div = document.createElement("div")
        div.className = "message bot"
        div.id = "loading"
        div.innerHTML = `<div class="avatar">💊</div><div class="bubble"><div class="spinner"></div></div>`
        chat.appendChild(div)
        chat.scrollTop = chat.scrollHeight
    }

    function removeLoading() {
        const l = document.getElementById("loading")
        if (l) l.remove()
    }

    function addBotMsg(text) {
        const div = document.createElement("div")
        div.className = "message bot"
        div.innerHTML = `<div class="avatar">💊</div><div class="bubble">${formatAnswer(text)}</div>`
        chat.appendChild(div)
        chat.scrollTop = chat.scrollHeight
    }

    async function sendMessage() {
        const question = input.value.trim()
        if (!question || loading) return

        loading = true
        btn.disabled = true
        addUserMsg(question)
        input.value = ""
        input.style.height = "auto"
        addLoading()

        try {
            const res = await fetch("http://127.0.0.1:8000/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            })

            removeLoading()
            if (!res.ok) throw new Error("Server error " + res.status)

            const data = await res.json()
            addBotMsg(data.answer)

        } catch (err) {
            removeLoading()
            const div = document.createElement("div")
            div.className = "message bot"
            div.innerHTML = `<div class="avatar">💊</div><div class="bubble"><span class="error">⚠️ Unable to reach server. Make sure FastAPI is running on port 8000.</span></div>`
            chat.appendChild(div)
            chat.scrollTop = chat.scrollHeight
        }

        loading = false
        btn.disabled = false
        input.focus()
    }
</script>

</body>
</html>
